name: Bug report
description: Report a reproducible FailLens problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove secrets and personal information from every log excerpt.
  - type: input
    id: version
    attributes:
      label: FailLens version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the result you received and what you expected.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal sanitized log
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and environment
      description: Include the command, operating system, and Node.js version.
    validations:
      required: true
