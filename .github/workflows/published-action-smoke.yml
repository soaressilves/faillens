name: Published Action smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a representative failing log
        id: source
        continue-on-error: true
        shell: bash
        run: |
          node -e "console.error('AssertionError: expected status 200 but received 401'); process.exit(1)" > published-action-smoke.log 2>&1

      - name: Analyze with the published FailLens Action
        id: faillens
        if: always()
        uses: soaressilves/faillens@v0.2.0
        with:
          log-file: published-action-smoke.log
          context: "1"

      - name: Verify the published Action result
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          FAILLENS_OUTCOME: ${{ steps.faillens.outcome }}
          STATUS: ${{ steps.faillens.outputs.status }}
          CATEGORY: ${{ steps.faillens.outputs.category }}
          CONFIDENCE: ${{ steps.faillens.outputs.confidence }}
          LINE: ${{ steps.faillens.outputs.line }}
        shell: bash
        run: |
          test "$SOURCE_OUTCOME" = "failure"
          test "$FAILLENS_OUTCOME" = "success"
          test "$STATUS" = "failure"
          test "$CATEGORY" = "test"
          test "$CONFIDENCE" = "high"
          test "$LINE" = "1"
